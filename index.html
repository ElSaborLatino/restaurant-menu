<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabor - Authentic Portuguese, Spanish & Italian Cuisine</title>
  <script>
    // The stylesheet and script links carry a stamp that app.js renews whenever it finds this browser holding
    // out-of-date files (see "self-check" in app.js). A new stamp is a new address, so no saved copy can be reused.
    // document.write keeps the stylesheet render-blocking, exactly like a plain <link>.
    var stamp = '';
    try { stamp = localStorage.getItem('sabor-stamp-v1') || ''; } catch (e) { /* storage blocked */ }
    stamp = /^[a-z0-9]+$/.test(stamp) ? '?v=' + stamp : '';
    document.write('<link rel="stylesheet" href="style.css' + stamp + '">');
  </script>
  <noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="brand-block">
        <h1 class="brand">sabor</h1>
        <div class="subtitle">Authentic Portuguese Spanish & Italian Cuisine</div>
      </div>
      <div class="header-controls">
        <select id="langSelect" class="lang-select">
          <option value="en">🇬🇧 EN</option>
          <option value="tr">🇹🇷 TR</option>
          <option value="pt">🇵🇹 PT</option>
        </select>
        <div class="currency-toggle" id="currencyToggle" role="group" aria-label="Currency" hidden>
          <button type="button" data-currency="try">₺</button>
          <button type="button" data-currency="eur">€</button>
        </div>
      </div>
    </div>

    <div class="nav-pills" id="navPills"></div>
  </header>

  <main>
    <p class="load-error">Loading menu…</p>
  </main>

  <footer>
    <div class="allergy-banner" id="banner"></div>
  </footer>

  <script>
    var appScript = document.createElement('script');
    appScript.type = 'module';
    appScript.src = 'app.js' + stamp;
    document.body.append(appScript);
  </script>
</body>
</html>
