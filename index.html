<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabor - Authentic Portuguese, Spanish & Italian Cuisine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-top">
      <div class="brand-block">
        <h1 class="brand">sabor</h1>
        <div class="subtitle">Authentic Portuguese Spanish & Italian Cuisine</div>
      </div>
      <div class="header-controls">
        <div class="currency-toggle" id="currencyToggle" role="group" aria-label="Currency" hidden>
          <button type="button" data-currency="try">₺</button>
          <button type="button" data-currency="eur">€</button>
        </div>
        <select id="langSelect" class="lang-select">
          <option value="en">🇬🇧 EN</option>
          <option value="tr">🇹🇷 TR</option>
          <option value="pt">🇵🇹 PT</option>
        </select>
      </div>
    </div>

    <div class="nav-pills" id="navPills"></div>
  </header>

  <main>
    <p class="load-error">Loading menu…</p>
  </main>

  <footer>
    <div class="allergy-banner" id="banner"></div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
